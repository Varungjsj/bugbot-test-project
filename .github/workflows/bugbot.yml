name: Bugbot Analysis

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  bugbot:
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'pull_request') ||
      (github.event_name == 'issue_comment' && 
       github.event.issue.pull_request && 
       (contains(github.event.comment.body, '@bugbot run') || 
        contains(github.event.comment.body, 'bugbot run') ||
        contains(github.event.comment.body, '@cursor fix')))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 mypy pylint black isort bandit safety
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      
      - name: Run Bug Detection
        id: bug_detection
        run: |
          echo "## Running Bug Detection Analysis..." >> $GITHUB_STEP_SUMMARY
          
          # Run our custom bug detector
          python bug_detector.py --output bug_report.md
          
          # Save the report for the comment
          echo "BUG_REPORT<<EOF" >> $GITHUB_OUTPUT
          cat bug_report.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          # Also add to step summary
          cat bug_report.md >> $GITHUB_STEP_SUMMARY
          
          # Run additional linters and capture output
          echo -e "\n## Additional Analysis\n" >> analysis_report.md
          
          echo "### Flake8 Results" >> analysis_report.md
          flake8 . --exclude=venv,__pycache__,.git --max-line-length=120 >> analysis_report.md 2>&1 || echo "Flake8 found some issues" >> analysis_report.md
          
          echo -e "\n### Security Analysis (Bandit)" >> analysis_report.md
          bandit -r . -f txt >> analysis_report.md 2>&1 || echo "Bandit found some security concerns" >> analysis_report.md
          
          # Combine reports
          echo -e "\n---\n" >> bug_report.md
          cat analysis_report.md >> bug_report.md
      
      - name: Comment PR (for PR events)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bug_report.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('Bug Detection Report')
            );
            
            const body = `## 🤖 Automated Bug Detection Results\n\n${report}\n\n---\n*This analysis was performed automatically. For more detailed Bugbot functionality, consider installing the [Cursor Bugbot GitHub App](https://github.com/apps/cursor-bot).*`;
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
      
      - name: Comment PR (for issue comments)
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('bug_report.md', 'utf8');
            
            const body = `## 🤖 Bugbot Analysis Complete\n\n${report}\n\n---\n*Analysis triggered by @${context.actor}*\n\n*This is an automated bug detection workflow. For enhanced Bugbot features, install the [Cursor Bugbot GitHub App](https://github.com/apps/cursor-bot).*`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
      
      - name: Upload Bug Report
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: bug-detection-report
          path: |
            bug_report.md
            analysis_report.md